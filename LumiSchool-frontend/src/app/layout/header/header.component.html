<header
  class="h-16 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 flex items-center justify-between px-3 sm:px-6 sticky top-0 z-30 transition-colors duration-200"
>
  <!-- Left Side: Mobile Menu Button & Breadcrumb Title -->
  <div class="flex items-center gap-3 sm:gap-4 min-w-0">
    <button
      (click)="toggleSidebar.emit()"
      class="w-9 h-9 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 flex-shrink-0 transition-colors shadow-2xs"
      title="Toggle sidebar"
    >
      <i class="fas fa-bars text-sm"></i>
    </button>

    <div class="flex items-center gap-2 min-w-0">
      <span class="text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hidden sm:inline-block border border-slate-200/60 dark:border-slate-700/60">
        Portal
      </span>
      <i class="fas fa-chevron-right text-[9px] text-slate-300 dark:text-slate-600 hidden sm:inline-block"></i>
      <h1 class="text-sm sm:text-base md:text-lg font-bold text-slate-800 dark:text-slate-100 truncate tracking-tight">
        {{ getPageTitle() }}
      </h1>
    </div>
  </div>

  <!-- Center: Quick Search Bar (Tablet / Desktop) -->
  <div class="hidden md:flex items-center flex-1 max-w-sm lg:max-w-md mx-4 lg:mx-8">
    <div class="relative w-full">
      <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      <input
        type="text"
        placeholder="Quick search students, classes, records..."
        class="w-full pl-9 pr-12 py-1.5 bg-slate-100/70 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-accent-500/20 focus:border-accent-500 transition-all"
      />
      <kbd class="absolute right-2.5 top-1/2 -translate-y-1/2 px-1.5 py-0.5 text-[9px] font-mono text-slate-400 bg-white dark:bg-slate-700 rounded border border-slate-200 dark:border-slate-600 shadow-2xs select-none">
        ⌘K
      </kbd>
    </div>
  </div>

  <!-- Right Side Actions & User Menu -->
  <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
    <!-- Academic Term / Year Status Pill -->
    <span
      class="hidden xl:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-400 border border-emerald-200/60 dark:border-emerald-800/40 select-none shadow-2xs"
    >
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
      Term 1 • 2026
    </span>

    <!-- Organization / Tenant Switcher -->
    <ng-container *ngIf="authService.tenantList$ | async as tenants">
      <div
        class="relative tenant-menu-wrapper"
        *ngIf="canSwitchTenants(tenants); else activeOrganizationBadge"
      >
        <button
          (click)="toggleTenantMenu($event)"
          class="flex items-center gap-2 px-2.5 sm:px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 bg-white dark:bg-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all shadow-2xs"
          [class.opacity-50]="switchingTenant"
          [disabled]="switchingTenant"
          title="Switch Organization"
        >
          <div
            class="w-5 h-5 rounded-md flex items-center justify-center text-[10px] font-bold text-white flex-shrink-0 shadow-2xs"
            [style.background-color]="themeService.accent"
          >
            <i class="fas fa-school text-[9px]"></i>
          </div>
          <span class="text-slate-700 dark:text-slate-300 hidden sm:inline-block max-w-[120px] truncate">
            {{ getActiveTenantName() }}
          </span>
          <i
            class="fas fa-chevron-down text-[10px] text-slate-400 transition-transform duration-200"
            [class.rotate-180]="showTenantMenu"
          ></i>
        </button>

        <!-- Organization Dropdown -->
        <div
          *ngIf="showTenantMenu"
          class="absolute right-0 top-full mt-2 w-64 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200/80 dark:border-slate-700/80 py-2 z-50 animate-in fade-in slide-in-from-top-2 duration-150"
        >
          <div class="px-3.5 py-2 border-b border-slate-100 dark:border-slate-700/80">
            <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
              Switch Organization
            </p>
          </div>

          <div
            *ngIf="tenantSwitchError"
            class="mx-3 mt-2 rounded-xl border border-red-200 bg-red-50 p-2.5 text-xs text-red-700 dark:border-red-900/50 dark:bg-red-950/30 dark:text-red-300"
          >
            {{ tenantSwitchError }}
          </div>

          <div class="max-h-56 overflow-y-auto p-1.5 space-y-1">
            <button
              *ngFor="let tenant of tenants"
              (click)="switchTenant(tenant)"
              class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium transition-all flex items-center gap-2.5 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/80 cursor-pointer"
              [class.bg-slate-100]="tenant._id === (authService.currentTenantId$ | async)"
              [class.dark:bg-slate-700]="tenant._id === (authService.currentTenantId$ | async)"
            >
              <span
                class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold text-white flex-shrink-0 shadow-2xs"
                [style.background-color]="themeService.accent"
              >
                {{ tenant.name.charAt(0).toUpperCase() }}
              </span>
              <span class="truncate font-semibold flex-1">{{ tenant.name }}</span>
              <i
                *ngIf="tenant._id === (authService.currentTenantId$ | async)"
                class="fas fa-check text-xs ml-auto"
                [style.color]="themeService.accent"
              ></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Static Active Organization Badge when only 1 tenant -->
      <ng-template #activeOrganizationBadge>
        <div
          *ngIf="tenants.length === 1"
          class="hidden sm:flex items-center gap-2 rounded-xl border border-slate-200/80 dark:border-slate-700/80 px-2.5 py-1.5 text-xs font-semibold text-slate-700 dark:text-slate-300 bg-slate-50/60 dark:bg-slate-800/60 shadow-2xs"
        >
          <div
            class="w-5 h-5 rounded-md flex items-center justify-center text-[10px] text-white flex-shrink-0"
            [style.background-color]="themeService.accent"
          >
            <i class="fas fa-school text-[9px]"></i>
          </div>
          <span class="max-w-[130px] truncate">{{ tenants[0].name }}</span>
        </div>
      </ng-template>
    </ng-container>

    <!-- Theme Switcher (Dark / Light Mode) -->
    <button
      (click)="themeService.toggleTheme()"
      class="w-9 h-9 rounded-xl border border-slate-200/80 dark:border-slate-700/80 flex items-center justify-center text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all shadow-2xs"
      [title]="(themeService.isDark$ | async) ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <i
        class="fas text-sm transition-transform duration-300"
        [class.fa-moon]="!(themeService.isDark$ | async)"
        [class.fa-sun]="themeService.isDark$ | async"
        [class.rotate-90]="themeService.isDark$ | async"
      ></i>
    </button>

    <!-- Accent Color Picker -->
    <div class="relative color-picker-wrapper">
      <button
        (click)="toggleColorPicker($event)"
        class="w-9 h-9 rounded-xl border border-slate-200/80 dark:border-slate-700/80 flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors shadow-2xs"
        title="Custom accent theme color"
      >
        <span
          class="w-4 h-4 rounded-full ring-2 ring-white dark:ring-slate-900 shadow-2xs transition-transform hover:scale-110"
          [style.background-color]="themeService.accent"
        ></span>
      </button>

      <app-color-picker
        *ngIf="showColorPicker"
        [color]="themeService.accent"
        (colorChange)="onAccentChange($event)"
        (close)="showColorPicker = false"
      ></app-color-picker>
    </div>

    <!-- User Profile Dropdown Menu -->
    <div class="relative user-menu-wrapper ml-1">
      <button
        (click)="toggleUserMenu($event)"
        class="flex items-center gap-2.5 pl-1.5 pr-2.5 py-1 rounded-xl border border-slate-200/80 dark:border-slate-700/80 hover:border-slate-300 dark:hover:border-slate-600 bg-white dark:bg-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all shadow-2xs"
      >
        <!-- User Avatar with Initials -->
        <div
          class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs text-white flex-shrink-0 shadow-2xs"
          [style.background-color]="themeService.accent"
        >
          {{ getUserInitials() }}
        </div>

        <!-- Name & Role -->
        <div class="text-left hidden md:block">
          <p class="text-xs font-bold text-slate-800 dark:text-slate-100 leading-tight truncate max-w-[120px]">
            {{ getUserDisplayName() }}
          </p>
          <p class="text-[10px] font-semibold text-slate-400 dark:text-slate-500 leading-tight">
            {{ getUserRoleName() }}
          </p>
        </div>

        <i
          class="fas fa-chevron-down text-[10px] text-slate-400 transition-transform duration-200"
          [class.rotate-180]="showUserMenu"
        ></i>
      </button>

      <!-- User Menu Popover -->
      <div
        *ngIf="showUserMenu"
        class="absolute right-0 top-full mt-2 w-60 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200/80 dark:border-slate-700/80 py-2 z-50 animate-in fade-in slide-in-from-top-2 duration-150"
      >
        <!-- User Summary Card -->
        <div class="px-3.5 py-2.5 border-b border-slate-100 dark:border-slate-700/80">
          <div class="flex items-center gap-3">
            <div
              class="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-sm text-white flex-shrink-0 shadow-2xs"
              [style.background-color]="themeService.accent"
            >
              {{ getUserInitials() }}
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-xs font-bold text-slate-800 dark:text-slate-100 truncate">
                {{ getUserDisplayName() }}
              </p>
              <p class="text-[11px] text-slate-400 dark:text-slate-500 truncate">
                {{ (authService.user$ | async)?.email }}
              </p>
            </div>
          </div>
          <div class="mt-2.5">
            <span
              class="inline-block px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider bg-slate-100 dark:bg-slate-700/80 text-slate-600 dark:text-slate-300"
            >
              {{ getUserRoleName() }}
            </span>
          </div>
        </div>

        <!-- Links -->
        <div class="p-1.5 space-y-1">
          <a
            routerLink="/settings"
            (click)="showUserMenu = false"
            class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/80 transition-colors cursor-pointer"
          >
            <i class="fas fa-sliders-h text-slate-400 text-xs w-4 text-center"></i>
            Account Settings
          </a>
        </div>

        <div class="my-1 border-t border-slate-100 dark:border-slate-700/80"></div>

        <!-- Logout Button -->
        <div class="p-1.5">
          <button
            (click)="logout(); showUserMenu = false"
            class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors text-left cursor-pointer"
          >
            <i class="fas fa-sign-out-alt text-xs w-4 text-center"></i>
            Sign Out
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
