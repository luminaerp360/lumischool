<aside
  class="fixed left-0 top-0 h-full bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-r border-slate-200/80 dark:border-slate-800 z-40 transition-all duration-300 ease-in-out flex flex-col shadow-xs"
  [class.w-64]="!collapsed || isMobile"
  [class.w-20]="collapsed && !isMobile"
  [class.-translate-x-full]="isMobile && mobileHidden"
  [class.translate-x-0]="!isMobile || !mobileHidden"
>
  <!-- Brand / Logo Header -->
  <div
    class="flex items-center h-16 px-4 border-b border-slate-100 dark:border-slate-800/80 flex-shrink-0"
    [class.justify-center]="collapsed && !isMobile"
  >
    <div class="flex items-center gap-3 min-w-0">
      <!-- Logo Icon Badge -->
      <div
        class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 shadow-xs relative group overflow-hidden bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/80 p-1"
      >
        <img
          src="assets/images/360.png"
          alt="Lumina ERP"
          class="w-full h-full object-contain transform group-hover:scale-110 transition-transform duration-200"
        />
      </div>

      <!-- App Name & Organization Subtitle -->
      <div *ngIf="!collapsed || isMobile" class="flex flex-col min-w-0">
        <div class="flex items-center gap-1.5">
          <span class="text-base font-extrabold tracking-tight text-slate-800 dark:text-slate-100">
            LumiSchool
          </span>
          <span
            class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded-full"
            [style.background-color]="themeService.accent + '20'"
            [style.color]="themeService.accent"
          >
            CBC
          </span>
        </div>
        <span class="text-[11px] font-medium text-slate-400 dark:text-slate-500 truncate max-w-[130px]">
          {{ getTenantShortName() }}
        </span>
      </div>
    </div>

    <!-- Mobile Close Button -->
    <button
      *ngIf="isMobile"
      (click)="toggle.emit()"
      class="ml-auto w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
      title="Close sidebar"
    >
      <i class="fas fa-times text-sm"></i>
    </button>
  </div>

  <!-- Navigation Sections -->
  <nav class="flex-1 py-3 px-3 space-y-4 overflow-y-auto scrollbar-thin">
    <div *ngFor="let section of sections" class="space-y-1">
      <!-- Section Header -->
      <div
        *ngIf="!collapsed || isMobile"
        class="px-2 pt-1 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 select-none"
      >
        {{ section.title }}
      </div>
      <div
        *ngIf="collapsed && !isMobile"
        class="w-6 h-px bg-slate-200 dark:bg-slate-800 mx-auto my-2"
      ></div>

      <!-- Section Items -->
      <a
        *ngFor="let item of section.items"
        [routerLink]="item.route"
        (click)="navigate.emit()"
        [title]="collapsed && !isMobile ? item.label : ''"
        class="group relative flex items-center gap-3 px-2.5 py-2 rounded-xl text-sm font-medium transition-all duration-200 cursor-pointer select-none"
        [ngClass]="{
          'bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white font-semibold shadow-2xs': isActive(item.route),
          'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-100/70 dark:hover:bg-slate-800/60': !isActive(item.route),
          'justify-center px-0': collapsed && !isMobile
        }"
      >
        <!-- Active Left Indicator Bar -->
        <span
          *ngIf="isActive(item.route)"
          class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-5 rounded-r-full transition-all duration-200"
          [style.background-color]="themeService.accent"
        ></span>

        <!-- Icon Tile -->
        <div
          class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 transition-transform duration-200 group-hover:scale-105"
          [style.background-color]="isActive(item.route) ? themeService.accent + '25' : 'transparent'"
          [style.color]="isActive(item.route) ? themeService.accent : ''"
        >
          <i [class]="item.icon" class="text-sm"></i>
        </div>

        <!-- Label -->
        <span
          *ngIf="!collapsed || isMobile"
          class="truncate flex-1 tracking-tight"
          [style.color]="isActive(item.route) ? themeService.accent : ''"
        >
          {{ item.label }}
        </span>
      </a>
    </div>
  </nav>

  <!-- Sidebar Footer / Collapse Trigger -->
  <div class="p-3 border-t border-slate-100 dark:border-slate-800/80 mt-auto bg-slate-50/60 dark:bg-slate-900/60 flex-shrink-0">
    <button
      (click)="toggle.emit()"
      class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-white dark:hover:bg-slate-800 border border-transparent hover:border-slate-200 dark:hover:border-slate-700 shadow-2xs transition-all duration-200"
      [class.justify-center]="collapsed && !isMobile"
      [title]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <i
        class="fas transition-transform duration-300"
        [class.fa-angle-double-left]="!collapsed"
        [class.fa-angle-double-right]="collapsed"
      ></i>
      <span *ngIf="!collapsed">Collapse</span>
    </button>
  </div>
</aside>
