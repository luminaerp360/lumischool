<div class="flex h-screen overflow-hidden bg-slate-50 dark:bg-slate-900 transition-colors duration-200">
  <!-- Mobile Backdrop Overlay -->
  <div
    *ngIf="isMobile && !mobileSidebarHidden"
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-30 lg:hidden transition-opacity duration-300"
    (click)="closeMobileSidebar()"
  ></div>

  <!-- Modern Sidebar -->
  <app-sidebar
    [collapsed]="sidebarCollapsed"
    [mobileHidden]="mobileSidebarHidden"
    [isMobile]="isMobile"
    (toggle)="toggleSidebar()"
    (navigate)="onNavigate()"
  ></app-sidebar>

  <!-- Main Content Region -->
  <div
    class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden transition-all duration-300 ease-in-out"
    [ngClass]="getMainContentClass()"
  >
    <!-- Modern Header -->
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>

    <!-- Page Content Router Outlet -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-5 lg:p-6 bg-slate-50/60 dark:bg-slate-900/40">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
