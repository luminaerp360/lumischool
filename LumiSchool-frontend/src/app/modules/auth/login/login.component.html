<div
  class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-slate-900 px-4 transition-colors duration-200"
>
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div
        class="inline-flex w-14 h-14 rounded-2xl items-center justify-center mb-4"
        [style.background-color]="themeService.accent"
      >
        <i class="fas fa-graduation-cap text-white text-2xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100">
        LumiSchool
      </h1>
      <p class="text-gray-500 dark:text-gray-400 mt-1">
        School Management System
      </p>
    </div>

    <div
      class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-gray-200 dark:border-slate-700 p-6 sm:p-8"
    >
      <div
        *ngIf="error"
        class="mb-4 p-3 rounded-lg bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm"
      >
        {{ error }}
      </div>

      <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-100 mb-6">
        Sign in to your account
      </h2>

      <div class="space-y-4">
        <div>
          <label
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
            >Email</label
          >
          <input
            type="email"
            [(ngModel)]="email"
            (keyup.enter)="login()"
            class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-gray-100 outline-none transition-colors"
            placeholder="your@email.com"
          />
        </div>
        <div>
          <label
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
            >Password</label
          >
          <input
            type="password"
            [(ngModel)]="password"
            (keyup.enter)="login()"
            class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-gray-100 outline-none transition-colors"
            placeholder=""
          />
        </div>
        <button
          (click)="login()"
          [disabled]="loading"
          class="w-full py-2.5 rounded-lg text-white font-medium transition-opacity"
          [style.background-color]="themeService.accent"
          [class.opacity-50]="loading"
        >
          <span *ngIf="!loading">Sign In</span>
          <span *ngIf="loading"
            ><i class="fas fa-spinner fa-spin mr-2"></i>Signing in...</span
          >
        </button>
      </div>
    </div>
  </div>
</div>
