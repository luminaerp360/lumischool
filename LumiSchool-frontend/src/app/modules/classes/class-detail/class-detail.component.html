<div>
  <button
    (click)="goBack()"
    class="text-sm text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 mb-4 inline-flex items-center gap-1"
  >
    <i class="fas fa-arrow-left"></i> Back to Classes
  </button>

  <div *ngIf="loading" class="flex items-center justify-center py-20">
    <i class="fas fa-spinner fa-spin text-2xl text-gray-400"></i>
  </div>

  <div *ngIf="!loading && schoolClass">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">
        {{ schoolClass.name }}
      </h1>
      <button (click)="editClass()" class="btn-primary flex items-center gap-2">
        <i class="fas fa-edit"></i> Edit
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Class Info -->
      <div
        class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 p-6"
      >
        <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-4">
          Class Information
        </h2>
        <div class="space-y-3">
          <div class="flex justify-between text-sm">
            <span class="text-gray-500 dark:text-gray-400">Level</span>
            <span class="text-gray-800 dark:text-gray-100">{{
              schoolClass.level
            }}</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-500 dark:text-gray-400">Class Teacher</span>
            <span class="text-gray-800 dark:text-gray-100">
              {{ teacherName(schoolClass.classTeacherId) }}
            </span>
          </div>
        </div>
      </div>

      <!-- Streams -->
      <div
        class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 p-6"
      >
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100">
            Streams ({{ streams.length }})
          </h2>
          <button
            (click)="toggleAddStream()"
            class="btn-primary text-sm flex items-center gap-1"
          >
            <i
              class="fas"
              [ngClass]="showAddStream ? 'fa-times' : 'fa-plus'"
            ></i>
            {{ showAddStream ? "Cancel" : "Add Stream" }}
          </button>
        </div>

        <!-- Add Stream Form -->
        <div
          *ngIf="showAddStream"
          class="mb-4 p-4 rounded-lg bg-gray-50 dark:bg-slate-700 border border-gray-200 dark:border-slate-600"
        >
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
            <div>
              <label
                class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1"
                >Stream Name <span class="text-red-500">*</span></label
              >
              <input
                [(ngModel)]="newStreamName"
                type="text"
                placeholder="e.g. Stream A, North"
                class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-slate-500 bg-white dark:bg-slate-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>
            <div>
              <label
                class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1"
                >Capacity</label
              >
              <input
                [(ngModel)]="newStreamCapacity"
                type="number"
                placeholder="45"
                min="1"
                class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-slate-500 bg-white dark:bg-slate-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
            </div>
          </div>
          <p *ngIf="streamError" class="text-xs text-red-500 mb-2">
            {{ streamError }}
          </p>
          <button
            (click)="saveStream()"
            [disabled]="savingStream"
            class="btn-primary text-sm flex items-center gap-2"
          >
            <i *ngIf="savingStream" class="fas fa-spinner fa-spin"></i>
            {{ savingStream ? "Saving..." : "Save Stream" }}
          </button>
        </div>

        <!-- Stream List -->
        <div *ngIf="loadingStreams" class="flex justify-center py-4">
          <i class="fas fa-spinner fa-spin text-gray-400"></i>
        </div>

        <div *ngIf="!loadingStreams">
          <div *ngIf="streams.length; else noStreams" class="space-y-2">
            <div
              *ngFor="let stream of streams"
              class="flex items-center justify-between px-3 py-2 rounded-lg bg-gray-50 dark:bg-slate-700"
            >
              <div>
                <span
                  class="text-sm font-medium text-gray-800 dark:text-gray-100"
                  >{{ stream.name }}</span
                >
                <span class="ml-2 text-xs text-gray-500 dark:text-gray-400"
                  >Capacity: {{ stream.capacity }}</span
                >
              </div>
              <button
                (click)="deleteStream(stream._id)"
                class="text-red-400 hover:text-red-600 dark:hover:text-red-300 text-xs p-1"
                title="Remove stream"
              >
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
          <ng-template #noStreams>
            <p class="text-sm text-gray-500 dark:text-gray-400">
              No streams configured yet.
            </p>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
