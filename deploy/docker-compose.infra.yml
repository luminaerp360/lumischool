
# ─────────────────────────────────────────────
# Shared infrastructure — Redis
# Start once and leave running across deploys:
#   docker compose -f deploy/docker-compose.infra.yml up -d
# ─────────────────────────────────────────────

services:
  redis:
    image: redis:7-alpine
    container_name: lumischool-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - lumischool-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    name: lumischool-redis-data

networks:
  lumischool-net:
    name: lumischool-net
    driver: bridge
