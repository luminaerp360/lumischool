# ─────────────────────────────────────────────────────────────
# /etc/nginx/sites-available/lumischool-backend
# Backend API: edapi.lumina360.tech → localhost:{3001|3002}
# ─────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name edapi.lumina360.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — reverse proxy to backend container
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edapi.lumina360.tech;

    # ── SSL (paths created by certbot) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/edapi.lumina360.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edapi.lumina360.tech/privkey.pem;

    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # ── Security headers ─────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"     always;
    add_header X-Content-Type-Options     "nosniff"        always;
    add_header X-XSS-Protection           "1; mode=block"  always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # ── Proxy to NestJS ──────────────────────────────────────
    location / {
        proxy_pass         http://lumischool_backend;
        proxy_http_version 1.1;

        # WebSocket support (BullMQ board, socket events, etc.)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        # Support large file uploads (S3/Cloudflare R2 pass-through)
        client_max_body_size  50m;
        proxy_buffer_size     128k;
        proxy_buffers         4 256k;
        proxy_busy_buffers_size 256k;
    }
}
