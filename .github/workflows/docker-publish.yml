name: Build and Push Docker Images to GHCR

on:
  push:
    branches: [ "main" ]
    paths:
      - 'LumiSchool-backend/**'
      - 'LumiSchool-frontend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner
        id: repo_owner
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      # ── Build & Push Backend ──
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./LumiSchool-backend
          file: ./LumiSchool-backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/lumischool-backend:latest
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/lumischool-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build & Push Frontend ──
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./LumiSchool-frontend
          file: ./LumiSchool-frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/lumischool-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/lumischool-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
